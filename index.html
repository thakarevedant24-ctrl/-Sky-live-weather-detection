<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sky live</title>


<link rel="stylesheet" href="style.css" />
</head>
<body>


  <canvas id="sky"></canvas>

 
  <div class="veil"></div>

  <main class="stage">

    <header class="chrome">
      <div class="place">
        <span class="dot loading" id="statusDot"></span>
        <span class="name" id="placeName">Locating…</span>
      </div>

    <section class="hero" aria-live="polite">
      <div class="icon" id="condIcon"></div>
      <div class="temp" id="temp">--°</div>
      <div class="cond" id="condLabel">Reading the sky</div>
    </section>

    <section class="readouts">
      <div class="gauge"><span class="g-label">Feels like</span><span class="g-value" id="feelsLike">--°</span></div>
      <div class="gauge"><span class="g-label">Wind</span><span class="g-value" id="wind">-- km/h</span></div>
      <div class="gauge"><span class="g-label">Humidity</span><span class="g-value" id="humidity">--%</span></div>
      <div class="gauge"><span class="g-label">Pressure</span><span class="g-value" id="pressure">-- hPa</span></div>
    </section>

    <footer>
      <div class="controls">
        <div class="search-wrap">
          <div class="suggestions" id="suggestions" hidden></div>
          <form id="searchForm" autocomplete="off">
            <input id="citySearch" type="text" placeholder="Search a city…" aria-label="Search a city" />
          </form>
        </div>
        <button id="locateBtn" type="button" aria-label="Use my location" title="Use my location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
      </div>
      <p class="foot" id="updated">Detecting your location…</p>
    </footer>

  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="script.js"></script>
</body>
</html>
